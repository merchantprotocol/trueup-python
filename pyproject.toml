[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "trueup"
version = "0.1.0"
description = "Official TrueUp API client for Python: reconcile ledgers, statements and bank feeds"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Merchant Protocol" }]
requires-python = ">=3.9"
dependencies = ["httpx>=0.27,<1"]
keywords = ["trueup", "reconciliation", "accounting", "bank-reconciliation", "ledger", "api-client"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Office/Business :: Financial :: Accounting",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://trueup-cloud.merchantprotocol.workers.dev/docs#sdks"
Source = "https://github.com/merchantprotocol/trueup-python"
Issues = "https://github.com/merchantprotocol/trueup-python/issues"

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/trueup"]
